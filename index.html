<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="opening-page">

    <div class="floating-hearts">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>✨</span>
        <span>💖</span>
        <span>🌸</span>
    </div>

    <main class="opening-card">

        <div class="envelope">💌</div>

        <p class="small-text">A little surprise is waiting...</p>

        <h1>
            And this is<br>
            <span>a surprise for you ❤️</span>
        </h1>

        <p class="opening-message">
            Something special is waiting behind this button.
        </p>

        <h2>Open will be enabled in...</h2>

        <div id="countdown" class="countdown">3</div>

        <button id="openButton" class="main-button" disabled>
            🔒 Please Wait...
        </button>

    </main>

    <script src="script.js"></script>
</body>
</html>
