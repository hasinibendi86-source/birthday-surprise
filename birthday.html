<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="birthday-page">

    <div class="floating-hearts">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>✨</span>
        <span>🎈</span>
        <span>🌸</span>
    </div>

    <div class="birthday-container">

        <p class="tiny-title">Today is your special day ✨</p>

        <h1 class="birthday-title">
            Happy Birthday
            <span>❤️</span>
        </h1>

        <div class="heart-reveal">

            <div class="heart">
                ❤️
            </div>

            <img
                src="images/birthday-girl.jpg"
                alt="Birthday Girl"
                class="birthday-photo"
            >

        </div>

        <p class="birthday-text">
            May your life always be filled with happiness,
            beautiful memories and lots of smiles. 💕
        </p>

        <div class="cake">
            🎂
        </div>

        <h2 class="wish-text">
            Make a wish... ✨
        </h2>

        <button class="main-button" onclick="goToMemories()">
            See Our Memories 📸
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
